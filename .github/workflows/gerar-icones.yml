name: Gerar ícones PNG

on:
  push:
    paths:
      - "scripts/gerar-icones.mjs"
      - ".github/workflows/gerar-icones.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar ícones
        run: node scripts/gerar-icones.mjs

      - name: Commitar ícones (se mudaram)
        run: |
          git add icons/*.png
          if git diff --cached --quiet; then
            echo "Ícones já atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Gera ícones PNG do PWA"
          git push
