<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240">
  <!-- Véu de opacidade: recortado sobre as letras, deixa o pigmento mais
       denso em umas partes e mais lavado em outras, como aquarela de verdade.
       Preto = tinta cheia; quanto mais transparente, mais o papel aparece. -->
  <defs>
    <filter id="espalha" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.022" numOctaves="4" seed="13" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="46" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="granula">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="380" height="240" fill="#000" opacity="0.82"/>
  <g filter="url(#espalha)">
    <ellipse cx="60" cy="36" rx="120" ry="72" fill="#000"/>
    <ellipse cx="270" cy="60" rx="115" ry="64" fill="#000" opacity="0.34"/>
    <ellipse cx="140" cy="165" rx="125" ry="70" fill="#000"/>
    <ellipse cx="340" cy="180" rx="105" ry="66" fill="#000" opacity="0.3"/>
    <ellipse cx="205" cy="112" rx="85" ry="52" fill="#000" opacity="0.52"/>
  </g>
  <rect width="380" height="240" filter="url(#granula)" opacity="0.12"/>
</svg>
