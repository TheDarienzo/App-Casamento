<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 16" preserveAspectRatio="none">
  <!-- Traço de pincel: a espessura e a tinta variam ao longo da linha. -->
  <defs>
    <filter id="tremido" x="-5%" y="-60%" width="110%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="3" seed="41" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d9070" stop-opacity="0.15"/>
      <stop offset="18%" stop-color="#6f8560" stop-opacity="0.55"/>
      <stop offset="52%" stop-color="#7d9070" stop-opacity="0.32"/>
      <stop offset="80%" stop-color="#6f8560" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#7d9070" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <path d="M6 9 Q150 6 300 8.5 T594 8" stroke="url(#tinta)" stroke-width="3.4" fill="none"
        stroke-linecap="round" filter="url(#tremido)"/>
</svg>
