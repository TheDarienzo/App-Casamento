<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" preserveAspectRatio="none">
  <defs>
    <filter id="molha" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="4" seed="5" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="38" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="claro" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6f855f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6f855f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="escuro" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#16200f" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#16200f" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="dourado" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d4b46a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d4b46a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#molha)">
    <ellipse cx="150" cy="80" rx="220" ry="130" fill="url(#claro)"/>
    <ellipse cx="470" cy="240" rx="200" ry="120" fill="url(#claro)" opacity="0.7"/>
    <ellipse cx="520" cy="60" rx="160" ry="90" fill="url(#dourado)"/>
    <ellipse cx="300" cy="300" rx="300" ry="120" fill="url(#escuro)"/>
  </g>
</svg>
