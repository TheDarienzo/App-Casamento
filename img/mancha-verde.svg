<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" preserveAspectRatio="none">
  <!-- Aguada densa de verde-oliva: o bloco da contagem regressiva pintado
       de uma vez só, com o pigmento acumulando nas bordas. -->
  <defs>
    <filter id="molhado" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="23" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="19" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="23" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="19" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="granula">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <path id="folha" d="M26 20 H274 Q282 20 282 30 V270 Q282 280 272 280 H28 Q18 280 18 270 V30 Q18 20 26 20 Z"/>
    <linearGradient id="lavada" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4c33"/>
      <stop offset="45%" stop-color="#2c3a24"/>
      <stop offset="100%" stop-color="#1d2817"/>
    </linearGradient>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- sombra do papel, já pintada aqui dentro -->
  <g transform="translate(0 7) scale(0.985 1)" transform-origin="150 150" filter="url(#sombra)">
    <use href="#folha" fill="#1c2614" fill-opacity="0.34"/>
  </g>
  <use href="#folha" fill="none" stroke="#2c3a24" stroke-opacity="0.42" stroke-width="9" filter="url(#halo)"/>
  <use href="#folha" fill="url(#lavada)" filter="url(#molhado)"/>
  <use href="#folha" fill="none" stroke="#16200f" stroke-opacity="0.55" stroke-width="4" filter="url(#molhado)"/>
  <g filter="url(#molhado)">
    <clipPath id="dentro"><use href="#folha"/></clipPath>
    <rect width="300" height="300" clip-path="url(#dentro)" filter="url(#granula)" opacity="0.10"/>
  </g>
</svg>
