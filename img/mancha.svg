<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" preserveAspectRatio="none">
  <!-- Retângulo de aquarela usado como borda pintada dos cartões (border-image).
       A borda ondula e o pigmento se acumula nela, como tinta secando no papel. -->
  <defs>
    <filter id="molhado" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="17" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="molhado-forte" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="17" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="granula">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <path id="folha" d="M26 20 H274 Q282 20 282 30 V270 Q282 280 272 280 H28 Q18 280 18 270 V30 Q18 20 26 20 Z"/>
  </defs>

  <!-- halo úmido: a tinta escapa um pouco além da borda -->
  <use href="#folha" fill="none" stroke="#7d9070" stroke-opacity="0.32" stroke-width="14" filter="url(#molhado-forte)"/>
  <!-- corpo do papel pintado -->
  <use href="#folha" fill="#fffdf7" fill-opacity="0.93" filter="url(#molhado)"/>
  <!-- pigmento que fica preso na borda ao secar -->
  <use href="#folha" fill="none" stroke="#6f8560" stroke-opacity="0.30" stroke-width="3" filter="url(#molhado)"/>
  <!-- granulação do papel dentro da mancha -->
  <g filter="url(#molhado)">
    <clipPath id="dentro"><use href="#folha"/></clipPath>
    <rect width="300" height="300" clip-path="url(#dentro)" filter="url(#granula)" opacity="0.06"/>
  </g>
</svg>
